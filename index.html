<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ידע נדרש">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ידע נדרש · ברוק תעופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F6F8F9; --line:#D4DDE1; --line-soft:#E4EAED;
  --ink:#121A1D; --ink-2:#3C4C53; --muted:#5F717A;
  --accent:#0B7C88; --accent-ink:#FFFFFF; --accent-soft:#DCF0F2;
  --warn:#C42E27; --warn-soft:#FBE4E2;
  --caut:#9A6B00; --caut-soft:#FAEFD4;
  --adv:#1F6E47;  --adv-soft:#DFF1E7;
  --info:#2A5C86; --info-soft:#E1ECF5;
  --shadow:0 1px 2px rgba(18,26,29,.06), 0 8px 24px -12px rgba(18,26,29,.22);
  --radius:14px;
  --f-disp:"Rubik","Helvetica Neue",Arial,sans-serif;
  --f-body:"Assistant","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1316; --surface:#151E22; --surface-2:#1B262B; --line:#2A383E; --line-soft:#212E33;
    --ink:#DCE5E9; --ink-2:#AEBDC4; --muted:#8497A0;
    --accent:#43D2E2; --accent-ink:#06222A; --accent-soft:#12333B;
    --warn:#FF6D62; --warn-soft:#3A1C1A;
    --caut:#F5BE4A; --caut-soft:#382D12;
    --adv:#5BD48C;  --adv-soft:#13301F;
    --info:#7FB4E0; --info-soft:#152B3C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1316; --surface:#151E22; --surface-2:#1B262B; --line:#2A383E; --line-soft:#212E33;
  --ink:#DCE5E9; --ink-2:#AEBDC4; --muted:#8497A0;
  --accent:#43D2E2; --accent-ink:#06222A; --accent-soft:#12333B;
  --warn:#FF6D62; --warn-soft:#3A1C1A;
  --caut:#F5BE4A; --caut-soft:#382D12;
  --adv:#5BD48C;  --adv-soft:#13301F;
  --info:#7FB4E0; --info-soft:#152B3C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{overflow-x:hidden}
body{
  direction:rtl; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.65;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  overflow-wrap:break-word; max-width:100vw;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.t{unicode-bidi:plaintext}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.top-in{max-width:62rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-disp);font-weight:800;font-size:1.06rem;letter-spacing:-.03em;line-height:1.2}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.62rem;
  letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.spacer{flex:1}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.58rem;font-weight:700;color:var(--ink-2)}

/* ---------- layout ---------- */
.wrap{max-width:62rem;margin:0 auto;padding:0 16px}
.view{display:none;padding-block:18px 8px}
.view.on{display:block}
.reading{max-width:40rem;margin-inline:auto}

h2.ch{font-family:var(--f-disp);font-weight:700;font-size:1.66rem;line-height:1.22;
  margin:6px 0 2px;text-wrap:balance;letter-spacing:-.03em}
.ch-meta{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:16px}

/* chapter chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:.83rem;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:500}

/* ---------- sections ---------- */
.sec{border-top:1px solid var(--line-soft);padding-block:2px}
.sec:first-of-type{border-top:none}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 0;font-family:var(--f-disp);font-weight:600;font-size:1.08rem;line-height:1.35;
  letter-spacing:-.02em}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .caret{flex:none;width:16px;height:16px;color:var(--muted);
  transition:transform .18s ease}
.sec[open]>summary .caret{transform:rotate(90deg)}
.sec>summary .n{margin-inline-start:auto;font-family:var(--f-mono);font-size:.66rem;
  color:var(--muted);font-weight:400}
.sec-body{padding-bottom:16px}

/* ---------- bullets ---------- */
ul.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.tree ul.tree{margin-top:7px;padding-inline-start:16px;
  border-inline-start:1px solid var(--line-soft);gap:6px}
li.bl{position:relative;padding-inline-start:15px;line-height:1.6}
li.bl::before{content:"";position:absolute;inset-inline-start:2px;top:.65em;
  width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.5}
li.bl.d1::before{width:4px;height:4px;background:var(--muted);opacity:.55}
li.bl .t{display:block}
li.bl.hit{background:var(--accent-soft);border-radius:8px;
  box-shadow:0 0 0 6px var(--accent-soft);animation:flash 2.2s ease 1 forwards}
@keyframes flash{0%,55%{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}
  100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.num{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);letter-spacing:-.02em}

/* checkbox items */
li.ck{padding-inline-start:0}
li.ck::before{display:none}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{appearance:none;flex:none;width:19px;height:19px;margin-top:.22em;
  border:1.5px solid var(--line);border-radius:5px;background:var(--surface);
  display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:10px;height:6px;border:2px solid var(--accent-ink);
  border-top:none;border-inline-end:none;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:checked+.t{color:var(--muted);text-decoration:line-through;
  text-decoration-color:var(--line)}
.ck-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;
  font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.ck-bar button{color:var(--accent);font-family:var(--f-body);font-size:.82rem}

/* ---------- figures ---------- */
.fig{margin:14px 0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden}
.fig-t{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);display:block;padding:11px 13px 0}
.steps{list-style:none;counter-reset:st;margin:9px 0 0;padding:0 13px;
  display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:st;font-size:.88rem;line-height:1.55;color:var(--ink);
  unicode-bidi:plaintext;padding-inline-start:27px;position:relative}
.steps li::before{content:counter(st);position:absolute;inset-inline-start:0;top:.12em;
  width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-family:var(--f-mono);font-size:.64rem;font-weight:700;display:grid;place-items:center}
.fig-img{display:block;width:100%;padding:13px;margin-top:4px;text-align:center;
  border-top:1px solid var(--line-soft)}
.fig-img img{display:block;width:100%;height:auto;margin:0 auto;border-radius:8px;
  background:#fff}
.fig-zoom{display:block;margin-top:7px;font-family:var(--f-mono);font-size:.6rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* zoom overlay */
.lb{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;
  flex-direction:column}
.lb-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);
  background:var(--surface)}
.lb-bar .ttl{flex:1;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lb-bar button{padding:7px 13px;border:1px solid var(--line);border-radius:9px;
  font-size:.83rem;background:var(--surface-2)}
.lb-scroll{flex:1;overflow:auto;display:grid;place-items:center;padding:16px;
  -webkit-overflow-scrolling:touch}
.lb-scroll img{display:block;image-rendering:auto;border-radius:8px;background:#fff}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.84rem;direction:ltr}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line-soft);
  vertical-align:top;line-height:1.45}
th{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);background:var(--surface-2);white-space:nowrap;font-weight:700}
tr:last-child td{border-bottom:none}
td{font-variant-numeric:tabular-nums}

/* ---------- emergency matrix ---------- */
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 16px}
.pill{font-family:var(--f-mono);font-size:.63rem;letter-spacing:.06em;padding:3px 9px;
  border-radius:999px;font-weight:700;white-space:nowrap}
.u-imm{background:var(--warn-soft);color:var(--warn)}
.u-poss{background:var(--caut-soft);color:var(--caut)}
.u-prac{background:var(--info-soft);color:var(--info)}
.u-cont{background:var(--adv-soft);color:var(--adv)}
.em{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;margin-bottom:11px;border-inline-start:4px solid var(--line)}
.em.lv-imm{border-inline-start-color:var(--warn)}
.em.lv-poss{border-inline-start-color:var(--caut)}
.em.lv-prac{border-inline-start-color:var(--info)}
.em.lv-cont{border-inline-start-color:var(--adv)}
.em-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.em-f{font-family:var(--f-mono);font-weight:700;font-size:.95rem;direction:ltr;
  letter-spacing:-.01em}
.em-tab{font-family:var(--f-mono);font-size:.62rem;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.em-c{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);direction:ltr;
  display:block;margin-bottom:8px}
.em-a{list-style:none;margin:0 0 9px;padding:0;direction:ltr;display:flex;
  flex-direction:column;gap:4px}
.em-a li{font-size:.83rem;line-height:1.5;color:var(--ink-2);padding-inline-start:13px;
  position:relative}
.em-a li::before{content:"▸";position:absolute;inset-inline-start:0;color:var(--muted);
  font-size:.7em;top:.15em}
.em-o{display:flex;flex-direction:column;gap:6px}
.em-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.em-when{font-family:var(--f-mono);font-size:.67rem;color:var(--muted);direction:ltr;
  min-width:0;overflow-wrap:anywhere;line-height:1.4}

/* ---------- cards mode ---------- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:7px 13px;font-size:.85rem;color:var(--ink-2);transition:background .15s}
.btn:active{background:var(--surface-2)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
select.btn{appearance:none;padding-inline-end:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
  linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:left 12px top 50%,left 7px top 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.count{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);
  margin-inline-start:auto;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:22px 20px;min-height:16rem;display:flex;
  flex-direction:column;touch-action:pan-y;user-select:none}
.card-ctx{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px;unicode-bidi:plaintext;
  line-height:1.5}
.card-front{font-family:var(--f-disp);font-weight:600;font-size:1.3rem;line-height:1.42;
  unicode-bidi:plaintext;text-wrap:balance;letter-spacing:-.02em}
.card-front.cz{font-family:var(--f-body);font-weight:400;font-size:1.14rem;letter-spacing:0}
.card-hint{margin-top:auto;padding-top:18px;font-family:var(--f-mono);font-size:.66rem;
  color:var(--muted);text-align:center;letter-spacing:.06em}
.card-back{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);
  animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card-ans{font-family:var(--f-mono);font-weight:700;font-size:1.8rem;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card-full{margin-top:8px;font-size:.9rem;color:var(--ink-2);unicode-bidi:plaintext}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);
  vertical-align:-2px;margin:0 3px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.judge button{padding:13px;border-radius:11px;font-size:.92rem;font-weight:500;
  border:1px solid var(--line)}
.j-no{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.j-yes{background:var(--adv-soft);color:var(--adv);border-color:transparent}

/* ---------- quiz ---------- */
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:20px}
.q-prompt{font-size:1.1rem;line-height:1.6;unicode-bidi:plaintext;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);
  font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums;direction:ltr;
  text-align:left;transition:background .12s,border-color .12s}
.opt:active{background:var(--accent-soft)}
.opt.ok{background:var(--adv-soft);border-color:var(--adv);color:var(--adv)}
.opt.no{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.opt[disabled]{cursor:default}
.q-src{margin-top:16px;padding:12px 14px;background:var(--surface-2);border-radius:11px;
  font-size:.87rem;color:var(--ink-2);unicode-bidi:plaintext;line-height:1.55}
.q-src b{font-family:var(--f-mono);color:var(--accent)}
.q-bar{height:4px;background:var(--line-soft);border-radius:999px;overflow:hidden;
  margin-bottom:16px}
.q-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;
  transition:width .3s ease}
.score{text-align:center;padding:30px 20px}
.score .big{font-family:var(--f-mono);font-size:3.2rem;font-weight:700;color:var(--accent);
  line-height:1;font-variant-numeric:tabular-nums}
.score p{color:var(--muted);margin:10px 0 22px}

/* ---------- search ---------- */
.sbox{position:relative;margin-bottom:8px}
.sbox input{width:100%;padding:13px 42px 13px 15px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);font-size:1rem}
.sbox svg{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none}
.res{border-top:1px solid var(--line-soft);padding:12px 0;width:100%;text-align:start;
  display:block}
.res-p{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px;unicode-bidi:plaintext}
.res-t{font-size:.94rem;line-height:1.55;unicode-bidi:plaintext;color:var(--ink)}
.res mark{background:var(--accent-soft);color:var(--accent);font-weight:700;
  border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:.92rem}

/* ---------- tab bar ---------- */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;color:var(--muted);transition:color .15s}
.tab svg{width:21px;height:21px}
.tab span{font-size:.65rem;font-weight:500}
.tab[aria-current="true"]{color:var(--accent)}
.tab .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}
.tab[aria-current="true"] .dot{opacity:1}

@media (min-width:760px){
  body{font-size:17px}
  h2.ch{font-size:2rem}
}
</style>
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">ידע נדרש<small>Brook Aviation</small></div>
    <div class="spacer"></div>
    <div class="ring" id="ring" title="התקדמות">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="16" fill="none" stroke="var(--line)" stroke-width="3"></circle>
        <circle id="ringArc" cx="19" cy="19" r="16" fill="none" stroke="var(--accent)"
                stroke-width="3" stroke-linecap="round" stroke-dasharray="100.5"
                stroke-dashoffset="100.5"></circle>
      </svg>
      <b id="ringTxt">0%</b>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main class="wrap">
  <section id="v-read" class="view on"><div class="reading" id="readBody"></div></section>

  <section id="v-cards" class="view">
    <div class="bar">
      <select class="btn" id="cardScope" aria-label="פרק"></select>
      <button class="btn" id="cardOnlyNew">רק לא ידועים</button>
      <button class="btn" id="cardShuffle">ערבב</button>
      <span class="count" id="cardCount"></span>
    </div>
    <div id="cardStage"></div>
  </section>

  <section id="v-quiz" class="view">
    <div class="bar">
      <select class="btn" id="quizScope" aria-label="פרק"></select>
      <button class="btn p" id="quizNew">מבחן חדש</button>
      <span class="count" id="quizCount"></span>
    </div>
    <div id="quizStage"></div>
  </section>

  <section id="v-search" class="view">
    <div class="sbox">

  return ids.map(id=>{
    const m = IMG[id];
    if(!m) return '';                       // dropped: its content is live text elsewhere
    const c = CAP[id] || {title:'', lines:[]};
    const steps = (c.lines && c.lines.length)
      ? '<ol class="steps">' + c.lines.map(l=>'<li>'+esc(l)+'</li>').join('') + '</ol>' : '';
    return '<figure class="fig">'
      + (c.title ? '<figcaption class="fig-t">'+esc(c.title)+'</figcaption>' : '')
      + steps
      + '<button class="fig-img" data-zoom="'+id+'" aria-label="הגדלת התרשים">'
      + '<img src="'+m.src+'" width="'+m.w+'" height="'+m.h+'" loading="lazy" '
      + 'alt="'+esc(c.title || 'תרשים')+'" style="max-width:min(100%,'+m.w+'px)">'
      + '<span class="fig-zoom">הקש להגדלה</span></button></figure>';
  }).join('');
}

function tableHTML(n){
  return '<div class="tw"><table><thead><tr>'
    + n.headers.map(h=>'<th>'+esc(h)+'</th>').join('')
    + '</tr></thead><tbody>'
    + n.rows.map(r=>'<tr>'+r.map(c=>'<td>'+markNums(esc(c))+'</td>').join('')+'</tr>').join('')
    + '</tbody></table></div>';
}

function emergHTML(n){
  const lv = (n.out||[]).reduce((a,o)=> URG_RANK[o[1]]>URG_RANK[a] ? o[1] : a, 'cont');
  /* One row per outcome: a short pill plus its trigger as wrapping text.
     Baking the trigger into the pill built an unbreakable ~340px box that
     overflowed the card and shoved the whole page sideways. */
  const pills = (n.out||[]).map(o=>{
    const u = URG[o[1]];
    return '<div class="em-row">'
      + (u ? '<span class="pill '+u.c+'">'+u.t+'</span>' : '')
      + (o[0] ? '<span class="em-when">'+esc(o[0])+'</span>' : '') + '</div>';
  }).join('');
  return '<div class="em lv-'+lv+'"><div class="em-h"><span class="em-f">'+esc(n.fault)+'</span>'
    + '<span class="em-tab">TAB '+esc(n.tab)+'</span></div>'
    + (n.cond ? '<span class="em-c">'+esc(n.cond)+'</span>' : '')
    + '<ul class="em-a">'+n.actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>'
    + '<div class="em-o">'+pills+'</div></div>';
}

/* `path` is the full ancestor chain, so repeated wording in two places
   (e.g. "Chocks: removed" in stations 4 and 9) gets two distinct keys. */
function nodeHTML(n, path, depth, plain){
  if(n.type === 'table') return tableHTML(n);
  if(n.type === 'emerg') return emergHTML(n);
  const here = path + '|' + n.text;
  const key = hash(here);
  const kids = n.children && n.children.length
    ? '<ul class="tree">' + n.children.map(k=>nodeHTML(k, here, depth+1, plain)).join('') + '</ul>' : '';
  const body = markNums(esc(n.text));
  if(n.check && !plain){
    const id = 'c_' + key;
    return '<li class="bl ck" data-k="'+key+'"><label class="chk" for="'+id+'">'
      + '<input type="checkbox" id="'+id+'" data-ck="'+key+'"'+(S.checks[key]?' checked':'')+'>'
      + '<span class="t">'+body+'</span></label>'+figs(n.images)+kids+'</li>';
  }
  return '<li class="bl d'+Math.min(depth,1)+'" data-k="'+key+'"><span class="t">'+body+'</span>'
    + figs(n.images) + kids + '</li>';
}

function countNodes(nodes){
  return nodes.reduce((a,n)=> a + (n.text ? 1 + countNodes(n.children||[]) : 1), 0);
}

let curCh = 0;

function renderChapter(i){
  curCh = i;
  const ch = CH[i];
  const hasChecks = JSON.stringify(ch).indexOf('"check"') > -1;
  let h = '<h2 class="ch">'+esc(ch.title)+'</h2>'
    + '<div class="ch-meta">'+ch.sections.length+' נושאים · '
    + ch.sections.reduce((a,s)=>a+countNodes(s.nodes),0)+' סעיפים</div>';
  if(ch.title.indexOf('טבלת חירום') === 0){
    h += '<div class="legend">'
      + Object.keys(URG).map(k=>'<span class="pill '+URG[k].c+'">'+URG[k].t+'</span>').join('')
      + '</div>';
  }
  h += figs(ch.images);
  if(hasChecks){
    h += '<div class="ck-bar"><span id="ckN"></span><button id="ckReset">איפוס סימונים</button></div>';
  }
  ch.sections.forEach((s, si)=>{
    const ctx = ch.title + '|' + s.title;
    h += '<details class="sec" open id="s'+i+'_'+si+'">'
      + '<summary>'+CARET+'<span class="t">'+esc(s.title)+'</span>'
      + '<span class="n">'+countNodes(s.nodes)+'</span></summary>'
      + '<div class="sec-body">' + figs(s.images)
      + '<ul class="tree">' + s.nodes.map(n=>nodeHTML(n, ctx, 0)).join('') + '</ul>'
      + '</div></details>';
  });
  $('#readBody').innerHTML = h;
  document.querySelectorAll('#chips .chip').forEach((c,n)=>
    c.setAttribute('aria-current', n===i ? 'true' : 'false'));
  const act = document.querySelector('#chips .chip[aria-current="true"]');
  if(act) act.scrollIntoView({block:'nearest', inline:'center'});
  paintChecks();
  window.scrollTo(0,0);
}

function paintChecks(){
  const box = $('#ckN'); if(!box) return;
  const all = document.querySelectorAll('#readBody input[data-ck]');
  const on = document.querySelectorAll('#readBody input[data-ck]:checked');
  box.textContent = on.length + ' / ' + all.length + ' סומנו';
}

$('#readBody').addEventListener('change', e=>{
  const i = e.target.closest('input[data-ck]'); if(!i) return;
  if(i.checked) S.checks[i.dataset.ck] = 1; else delete S.checks[i.dataset.ck];
  save(); paintChecks();
});
$('#readBody').addEventListener('click', e=>{
  if(e.target.id === 'ckReset'){
    document.querySelectorAll('#readBody input[data-ck]').forEach(i=>{
      i.checked = false; delete S.checks[i.dataset.ck];
    });
    save(); paintChecks();
  }
});

/* chapter chips */
$('#chips').innerHTML = CH.map((c,i)=>
  '<button class="chip" data-i="'+i+'">'+esc(c.title)+'</button>').join('');
$('#chips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(b) renderChapter(+b.dataset.i);
});

/* ---------- progress ring ---------- */
function paintRing(){
  const known = CARDS.filter(c=>S.known[c.id]).length;
  const pct = CARDS.length ? Math.round(known/CARDS.length*100) : 0;
  $('#ringTxt').textContent = pct + '%';
  $('#ringArc').style.strokeDashoffset = String(100.5 * (1 - pct/100));
  $('#ringArc').style.strokeDasharray = '100.5';
}

/* ---------- flashcards ---------- */
let deck = [], di = 0, flipped = false, onlyNew = false, scope = '*';

function buildDeck(){
  deck = CARDS.filter(c => (scope === '*' || c.ch === scope) && (!onlyNew || !S.known[c.id]));
  di = 0; flipped = false; drawCard();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function backHTML(c){
  if(c.kind === 'cloze')
    return '<div class="card-ans">'+esc(c.answer)+'</div>'
      + '<div class="card-full">'+markNums(esc(c.full))+'</div>';
  return '<ul class="tree">'
    + c.back.map(n=>nodeHTML(n, c.ch+'|'+c.sec, 0, true)).join('') + '</ul>';
}

function drawCard(){
  const st = $('#cardStage');
  if(!deck.length){
    st.innerHTML = '<div class="empty">אין כרטיסיות בסינון הזה.<br>נסה פרק אחר או בטל את «רק לא ידועים».</div>';
    $('#cardCount').textContent = ''; return;
  }
  if(di >= deck.length) di = 0;
  const c = deck[di];
  const front = c.kind === 'cloze' ? blanks(markNums(esc(c.front))) : esc(c.front);
  st.innerHTML = '<div class="card" id="card">'
    + '<div class="card-ctx">'+esc(c.ch)+' › '+esc(c.ctx || c.sec)+'</div>'
    + '<div class="card-front'+(c.kind==='cloze'?' cz':'')+'">'+front+'</div>'
    + (flipped ? '<div class="card-back">'+backHTML(c)+'</div>'
               : '<div class="card-hint">הקש לגילוי</div>')
    + '</div>'
    + (flipped ? '<div class="judge"><button class="j-no" data-j="0">עוד לא</button>'
        + '<button class="j-yes" data-j="1">יודע</button></div>' : '');
  $('#cardCount').textContent = (di+1) + ' / ' + deck.length + ' · ' +
    CARDS.filter(x=>S.known[x.id]).length + ' ידועים';
  bindSwipe($('#card'));
}

$('#cardStage').addEventListener('click', e=>{
  const j = e.target.closest('[data-j]');
  if(j){
    const c = deck[di];
    if(j.dataset.j === '1') S.known[c.id] = 1; else delete S.known[c.id];
    save(); next(1); return;
  }
  if(e.target.closest('#card') && !flipped){ flipped = true; drawCard(); }
});
function next(d){ flipped = false; di = (di + d + deck.length) % deck.length; drawCard(); }

function bindSwipe(el){
  if(!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.6) next(dx > 0 ? -1 : 1);
    x0 = null;
  }, {passive:true});
}

$('#cardOnlyNew').addEventListener('click', e=>{
  onlyNew = !onlyNew; e.target.classList.toggle('p', onlyNew); buildDeck();
});
$('#cardShuffle').addEventListener('click', ()=>{ shuffle(deck); di=0; flipped=false; drawCard(); });
$('#cardScope').addEventListener('change', e=>{ scope = e.target.value; buildDeck(); });

/* ---------- quiz ---------- */
let qs = [], qi = 0, qScope = '*', answered = false, right = 0;

function weight(q){ return ((S.miss[q.id]||0) * 3 + 1) / ((S.hit[q.id]||0) + 1); }

function newQuiz(){
  const pool = QUIZ.filter(q => qScope === '*' || q.ch === qScope);
  const picked = [], bag = pool.slice();
  const n = Math.min(10, bag.length);
  for(let k=0; k<n; k++){
    let tot = 0; bag.forEach(q => tot += weight(q));
    let r = Math.random() * tot, idx = 0;
    for(let i=0;i<bag.length;i++){ r -= weight(bag[i]); if(r <= 0){ idx = i; break; } }
    picked.push(bag.splice(idx,1)[0]);
  }
  qs = picked; qi = 0; right = 0; answered = false; drawQ();
}

function drawQ(){
  const st = $('#quizStage');
  if(!qs.length){ st.innerHTML = '<div class="empty">אין שאלות בפרק הזה.</div>';
    $('#quizCount').textContent=''; return; }
  if(qi >= qs.length){
    st.innerHTML = '<div class="q-card score"><div class="big">'+right+'/'+qs.length+'</div>'
      + '<p>'+(right === qs.length ? 'הכל נכון.' :
              right >= qs.length*0.7 ? 'קרוב. השאלות שפספסת יחזרו מוקדם יותר.' :
              'השאלות שפספסת יחזרו מוקדם יותר במבחן הבא.')+'</p>'
      + '<button class="btn p" id="again">מבחן נוסף</button></div>';
    $('#quizCount').textContent = '';
    $('#again').addEventListener('click', newQuiz);
    return;
  }
  const q = qs[qi];
  st.innerHTML = '<div class="q-bar"><i style="width:'+(qi/qs.length*100)+'%"></i></div>'
    + '<div class="q-card"><div class="card-ctx">'+esc(q.ctx)+'</div>'
    + '<div class="q-prompt">'+blanks(markNums(esc(q.prompt)))+'</div>'
    + '<div class="opts">'+q.choices.map(c=>
        '<button class="opt" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>'
    + '<div id="qAfter"></div></div>';
  $('#quizCount').textContent = (qi+1) + ' / ' + qs.length;
  answered = false;
}

$('#quizStage').addEventListener('click', e=>{
  const b = e.target.closest('.opt'); if(!b || answered) return;
  answered = true;
  const q = qs[qi], pick = b.dataset.c, ok = pick === q.answer;
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled = true;
    if(o.dataset.c === q.answer) o.classList.add('ok');
    else if(o === b) o.classList.add('no');
  });
  if(ok){ right++; S.hit[q.id] = (S.hit[q.id]||0)+1; }
  else  { S.miss[q.id] = (S.miss[q.id]||0)+1; }
  save();
  $('#qAfter').innerHTML = '<div class="q-src">'+markNums(esc(q.source))
    + '<br><b>'+esc(q.sec)+'</b></div>'
    + '<div class="judge" style="grid-template-columns:1fr"><button class="btn p" id="qNext">'
    + (qi === qs.length-1 ? 'סיום' : 'הבא') + '</button></div>';
  $('#qNext').addEventListener('click', ()=>{ qi++; drawQ(); });
});
$('#quizNew').addEventListener('click', newQuiz);
$('#quizScope').addEventListener('change', e=>{ qScope = e.target.value; newQuiz(); });

/* ---------- scope selects ---------- */
[['#cardScope', CARDS], ['#quizScope', QUIZ]].forEach(([sel, src])=>{
  const counts = {};
  src.forEach(x=> counts[x.ch] = (counts[x.ch]||0)+1);
  $(sel).innerHTML = '<option value="*">כל הפרקים</option>'
    + CH.filter(c=>counts[c.title]).map(c=>
        '<option value="'+esc(c.title)+'">'+esc(c.title)+' ('+counts[c.title]+')</option>').join('');
});

/* ---------- search ---------- */
const INDEX = [];
(function(){
  CH.forEach((ch, ci)=>{
    ch.sections.forEach((s, si)=>{
      const disp = ch.title + ' › ' + s.title;
      INDEX.push({ci, si, k:null, p:ch.title, t:s.title});
      // mirrors nodeHTML's path-based key exactly, so a result can jump to its bullet
      const walk = (nodes, p)=> nodes.forEach(n=>{
        if(n.type === 'table'){
          n.rows.forEach(r=> INDEX.push({ci, si, k:null, p:disp, t:r.join(' · ')}));
          return;
        }
        if(n.type === 'emerg'){
          INDEX.push({ci, si, k:null, p:disp + ' › ' + n.fault,
                      t:[n.cond].concat(n.actions).filter(Boolean).join(' · ')});
          return;
        }
        const here = p + '|' + n.text;
        INDEX.push({ci, si, k:hash(here), p:disp, t:n.text});
        (n.images||[]).forEach(id=>{
          const c = CAP[id];
          if(c && c.lines) c.lines.forEach(l=>
            INDEX.push({ci, si, k:null, p:disp + ' › ' + c.title, t:l}));
        });
        walk(n.children||[], here);
      });
      walk(s.nodes, ch.title + '|' + s.title);
    });
    (ch.images||[]).forEach(id=>{
      const c = CAP[id];
      if(c && c.lines) c.lines.forEach(l=>
        INDEX.push({ci, si:0, k:null, p:ch.title + ' › ' + c.title, t:l}));
    });
  });
})();

const norm = s => s.toLowerCase().replace(/[״׳"'`,.ְ-ׇ]/g,'');
let sT = 0;
$('#q').addEventListener('input', e=>{
  clearTimeout(sT);
  const v = e.target.value;
  sT = setTimeout(()=>runSearch(v), 110);
});

function runSearch(v){
  const terms = norm(v).split(/\s+/).filter(t=>t.length > 1);
  const out = $('#results');
  if(!terms.length){
    out.innerHTML = '<div class="empty">חיפוש בכל '+INDEX.length+' השורות — מגבלות, בד״חים, נהלים.</div>';
    return;
  }
  const hits = INDEX.filter(e=>{ const n = norm(e.t); return terms.every(t=> n.indexOf(t) > -1); })
                    .slice(0, 80);
  if(!hits.length){ out.innerHTML = '<div class="empty">לא נמצא «'+esc(v)+'»</div>'; return; }
  out.innerHTML = hits.map((h,i)=>{
    let t = esc(h.t);
    terms.forEach(term=>{
      t = t.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>');
    });
    return '<button class="res" data-i="'+i+'"><div class="res-p">'+esc(h.p)+'</div>'
      + '<div class="res-t">'+t+'</div></button>';
  }).join('');
  out._hits = hits;
}

$('#results').addEventListener('click', e=>{
  const b = e.target.closest('.res'); if(!b) return;
  const h = $('#results')._hits[+b.dataset.i];
  go('read');
  renderChapter(h.ci);
  const sec = document.getElementById('s'+h.ci+'_'+h.si);
  if(sec) sec.open = true;
  requestAnimationFrame(()=>{
    const el = h.k ? document.querySelector('#readBody [data-k="'+h.k+'"]') : sec;
    if(el){
      el.scrollIntoView({block:'center', behavior:'smooth'});
      if(h.k){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 2400); }
    }
  });
});

/* ---------- zoom overlay ---------- */
let lbId = null, lbZ = 1;
const LB_STEPS = [1, 2, 3, 4];

function lbDraw(){
  const m = IMG[lbId]; if(!m) return;
  const c = CAP[lbId] || {title:''};
  $('#lbTitle').textContent = c.title || '';
  $('#lbZoom').textContent = '×' + lbZ;
  $('#lbScroll').innerHTML = '<img src="'+m.src+'" alt="'+esc(c.title||'תרשים')+'" '
    + 'style="width:'+(m.w * lbZ)+'px;max-width:none">';
}
function lbOpen(id){
  lbId = id; lbZ = 1;
  const box = $('#lbScroll');
  lbDraw();
  // start at the zoom that fills the screen width, never below 1
  const fit = Math.max(1, Math.min(4, Math.round(box.clientWidth / IMG[id].w)));
  if(fit !== lbZ){ lbZ = fit; lbDraw(); }
  $('#lb').hidden = false;
  document.body.style.overflow = 'hidden';
}
function lbClose(){
  $('#lb').hidden = true; lbId = null;
  document.body.style.overflow = '';
}
document.addEventListener('click', e=>{
  const z = e.target.closest('[data-zoom]');
  if(z){ lbOpen(z.dataset.zoom); }
});
$('#lbClose').addEventListener('click', lbClose);
$('#lb').addEventListener('click', e=>{ if(e.target.id === 'lbScroll') lbClose(); });
$('#lbZoom').addEventListener('click', ()=>{
  lbZ = LB_STEPS[(LB_STEPS.indexOf(lbZ) + 1) % LB_STEPS.length];
  lbDraw();
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && lbId) lbClose(); });

/* ---------- tabs ---------- */
const TABS = [
  ['read','קריאה','<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5.5A1.5 1.5 0 0 1 4 15.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h4.5a1.5 1.5 0 0 0 1.5-1.5z"/>'],
  ['cards','כרטיסיות','<rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h11a3 3 0 0 1 3 3v9"/>'],
  ['quiz','מבחן','<path d="M12 17h.01"/><path d="M9.1 9a3 3 0 1 1 4.2 3.3c-.8.4-1.3 1.1-1.3 2"/><circle cx="12" cy="12" r="9"/>'],
  ['search','חיפוש','<circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>']
];
$('#tabs').innerHTML = TABS.map(([id,label,path])=>
  '<button class="tab" data-v="'+id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
  + 'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'
  + '<span>'+label+'</span><i class="dot"></i></button>').join('');

function go(v){
  document.querySelectorAll('.view').forEach(s=> s.classList.toggle('on', s.id === 'v'+'-'+v));
  document.querySelectorAll('.tab').forEach(t=> t.setAttribute('aria-current', t.dataset.v === v ? 'true':'false'));
  $('#chips').style.display = v === 'read' ? '' : 'none';
  if(v === 'cards' && !deck.length) buildDeck();
  if(v === 'quiz' && !qs.length) newQuiz();
  if(v === 'search') setTimeout(()=>$('#q').focus(), 60);
  window.scrollTo(0,0);
}
$('#tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(t) go(t.dataset.v);
});

/* ---------- boot ---------- */
function redrawAll(){
  renderChapter(curCh); paintRing();
  if(deck.length) drawCard();
}
renderChapter(0);
paintRing();
runSearch('');
document.querySelector('.tab').setAttribute('aria-current','true');
})();
</script>
</body>
